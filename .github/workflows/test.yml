name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      plugin_ref:
        description: venomlabs-dev/plugin ref whose llms-install.md the Cline job installs from
        default: main
      cline_model:
        description: Ollama model for the Cline job
        default: qwen2.5-coder:7b
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/sync-shared.mjs --check
  copilot-live:
    # Venom Full for Copilot in the real Copilot CLI against a stand-in model:
    # one install brings the server, the skill and the hooks, and the hooks'
    # texts reach the model. Linux only: no keychain involved.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @github/copilot@1.0.114
      - run: sh copilot/test/live/run.sh
  copilot-marketplace:
    # After a merge: the published install, venom-full@venom from the venom
    # marketplace in venomlabs-dev/plugin, which fetches copilot/ from main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @github/copilot@1.0.114
      - run: sh copilot/test/live/run.sh
        env:
          MARKETPLACE: venomlabs-dev/plugin
  cline-install:
    # The real Cline CLI on a real (open) model installs Venom from nothing
    # but the published llms-install.md, as Cline's MCP marketplace does.
    # Ollama serves the model on the runner: no key, nothing paid. After merges
    # and by hand only: CPU inference is slow. Linux only: Cline uses the macOS
    # keychain.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODEL: ${{ inputs.cline_model || 'qwen2.5-coder:7b' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g cline@3.0.75
      - name: Ollama with a long context
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          OLLAMA_CONTEXT_LENGTH=32768 nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/version && break; sleep 1; done
          ollama pull "$MODEL"
      - run: sh cline/test/live/install.sh
        env:
          PLUGIN_REF: ${{ inputs.plugin_ref || 'main' }}
          OUT_DIR: ${{ runner.temp }}/cline-install
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cline-install
          path: |
            ${{ runner.temp }}/cline-install
            ${{ runner.temp }}/ollama.log
